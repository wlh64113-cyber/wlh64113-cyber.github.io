name: Check Hexo build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify generated site
        run: |
          test -f public/index.html
          test -f public/learn/index.html
          test -f public/learn/git-01-basics/index.html
          test -f public/learn/git-02-branches/index.html
          test -f public/learn/git-03-github-workflow/index.html
          test -f public/archives/index.html
          test -f public/tags/index.html
          test -f public/categories/index.html
