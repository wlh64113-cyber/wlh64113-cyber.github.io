post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: butterfly

search:
  path: search.xml
  field: post
  content: true
  format: html

marked:
  gfm: true
  breaks: false
  prependRoot: true
  postAsset: false
  external_link:
